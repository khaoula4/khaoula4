name: 🧮 Generate GitHub Metrics

on:
  schedule: [{cron: "0 0 * * *"}] 
  push: {branches: ["main"]}
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg

          base: "activity, community"

          plugin_languages: yes
          plugin_lines: yes
          plugin_traffic: yes
          plugin_followup: yes        
          plugin_notable: no         
          plugin_stars: no          
